<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MENSCH — Summer Collection Master</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:40 8% 95%; --surface:40 14% 99%; --raised:40 10% 97%; --recess:40 8% 92%;
  --line:36 9% 87%; --line-2:36 8% 79%;
  --ink:30 6% 16%; --ink-2:30 4% 34%; --ink-3:32 5% 48%;
  --accent:32 24% 44%; --accent-soft:34 24% 93%;
  --mgmt:32 5% 52%; --prod:32 24% 44%;
  --pos:150 30% 34%; --cau:36 55% 40%; --neg:8 55% 46%;
  --sb:15.5rem; --hdr:60px; --r:10px; color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}*{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:hsl(var(--canvas));color:hsl(var(--ink));
  font-family:'Inter',ui-sans-serif,system-ui,sans-serif;font-size:.9375rem;line-height:1.55;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
a{color:inherit;text-decoration:none} img{display:block;max-width:100%}
table{border-collapse:collapse;width:100%}
:focus-visible{outline:2px solid hsl(var(--accent));outline-offset:2px}
::selection{background:hsl(var(--accent));color:#fff}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.fig,td[data-n],th[data-n],.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.t-micro{font-size:.6875rem;line-height:1rem;letter-spacing:.04em}
.t-label{font-size:.75rem;line-height:1.15rem}
.caps{font-size:.6875rem;letter-spacing:.11em;text-transform:uppercase;font-weight:600;color:hsl(var(--ink-3))}
.muted{color:hsl(var(--ink-2))}.faint{color:hsl(var(--ink-3))}
.semi{font-weight:600}.med{font-weight:500}
.pos{color:hsl(var(--pos))}.cau{color:hsl(var(--cau))}.neg{color:hsl(var(--neg))}
.spacer{flex:1}.row{display:flex;align-items:center;gap:.5rem}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:.75rem}
.wrap{flex-wrap:wrap}.stack{display:flex;flex-direction:column;gap:1rem}
.stack-s{display:flex;flex-direction:column;gap:.5rem}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.875rem}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.875rem}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.875rem}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.g2,.g3,.g4{grid-template-columns:1fr}}

/* ── shell ─────────────────────────────────────────────────────────────*/
.sb{position:fixed;inset:0 auto 0 0;width:var(--sb);z-index:40;display:flex;flex-direction:column;
  background:hsl(var(--surface));border-right:1px solid hsl(var(--line))}
.sb-brand{padding:1.125rem 1.25rem 1rem;border-bottom:1px solid hsl(var(--line));
  display:flex;align-items:center;gap:.75rem}
.sb-mark{flex:none;line-height:0}
.bison{display:block;overflow:visible}
.lockup{display:inline-flex;align-items:center;gap:.62em;line-height:1}
.lockword{font-family:'Arial',Helvetica,sans-serif;font-weight:400;letter-spacing:.34em;
  font-size:1em;white-space:nowrap}
.cover-mark{position:absolute;top:1.1rem;right:1.25rem;opacity:.9;line-height:0}
.sb-name{font-weight:600;font-size:13px;letter-spacing:.26em;text-transform:uppercase}
.sb-sub{font-size:10.5px;color:hsl(var(--ink-3));margin-top:3px}
.sb-nav{flex:1;overflow-y:auto;padding:.5rem .5rem 1rem;scrollbar-width:thin}
.sb-nav::-webkit-scrollbar{width:4px}
.sb-nav::-webkit-scrollbar-thumb{background:hsl(var(--line-2));border-radius:2px}
.s-link{display:flex;align-items:center;gap:.625rem;width:100%;padding:.4375rem .625rem;
  border-radius:7px;color:hsl(var(--ink-2));font-size:12.5px;font-weight:500;margin-bottom:1px;
  transition:background .12s,color .12s}
.s-link:hover{background:hsl(var(--canvas));color:hsl(var(--ink))}
.s-link[aria-current="true"]{background:hsl(var(--ink));color:#fff}
.s-num{font-family:'IBM Plex Mono',monospace;font-size:9.5px;opacity:.5;width:14px;flex:none}
.s-txt{flex:1;min-width:0}
.s-pct{font-family:'IBM Plex Mono',monospace;font-size:9.5px;opacity:.6;flex:none}
.sb-foot{padding:.75rem 1rem;border-top:1px solid hsl(var(--line));display:flex;gap:.4375rem}
.sb-fb{flex:1;text-align:center;font-size:11px;font-weight:500;color:hsl(var(--ink-3));
  padding:.4375rem;border:1px solid hsl(var(--line));border-radius:6px;transition:.12s}
.sb-fb:hover{color:hsl(var(--ink));border-color:hsl(var(--line-2))}
.app{padding-left:var(--sb);min-height:100dvh}
.topbar{position:sticky;top:0;z-index:30;height:var(--hdr);background:hsl(var(--canvas)/.93);
  backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid hsl(var(--line));
  display:flex;align-items:center;gap:.875rem;padding:0 clamp(1rem,2.4vw,1.75rem)}
.crumbs{font-size:12.5px;color:hsl(var(--ink-3));font-weight:500;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.crumbs b{color:hsl(var(--ink));font-weight:600}
main{max-width:80rem;padding:clamp(1.25rem,2.6vw,1.75rem) clamp(1rem,2.4vw,1.75rem) 5rem}

/* logo slot, top-right */
.logoslot{display:flex;align-items:center;gap:.625rem;flex:none}
.logobox{width:40px;height:40px;border:1px dashed hsl(var(--line-2));border-radius:8px;
  display:grid;place-items:center;cursor:pointer;overflow:hidden;background:hsl(var(--surface))}
.logobox.filled{border-style:solid}
.logobox img{width:100%;height:100%;object-fit:contain;padding:3px}
.logobox span{font-size:9px;color:hsl(var(--ink-3));letter-spacing:.06em}

/* ── page furniture ────────────────────────────────────────────────────*/
.ph{margin-bottom:1.25rem}
.ph h1{font-size:1.5rem;line-height:1.9rem;letter-spacing:-.028em;font-weight:300}
.ph .sub{color:hsl(var(--ink-3));font-size:13px;margin-top:.25rem;max-width:64ch}
.brief{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:hsl(var(--line));
  border:1px solid hsl(var(--line));border-radius:var(--r);overflow:hidden;margin-bottom:1.5rem}
.brief div{background:hsl(var(--surface));padding:.875rem 1rem}
.brief .k{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;
  color:hsl(var(--ink-3))}
.brief p{font-size:12px;line-height:1.2rem;color:hsl(var(--ink-2));margin-top:.375rem}
@media(max-width:900px){.brief{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.brief{grid-template-columns:1fr}}
.blk{display:flex;align-items:baseline;gap:.75rem;margin:1.75rem 0 .875rem;
  padding-bottom:.4375rem;border-bottom:1.5px solid hsl(var(--ink))}
.blk h2{font-size:1rem;font-weight:500;letter-spacing:-.012em}
.blk .ln{flex:1}
.blk .r{font-size:11.5px;color:hsl(var(--ink-3));white-space:nowrap}
.panel{background:hsl(var(--surface));border:1px solid hsl(var(--line));border-radius:var(--r);overflow:hidden}
.p-head{display:flex;align-items:center;justify-content:space-between;gap:.75rem;
  padding:.75rem 1rem;border-bottom:1px solid hsl(var(--line))}
.p-head h3{font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.p-body{padding:1rem}.p-body.flush{padding:0;overflow-x:auto}
.panel.ink{background:hsl(var(--ink));color:hsl(var(--canvas));border-color:hsl(var(--ink))}
.panel.ink .faint{color:hsl(38 8% 66%)}

/* who fills what */
.byM{border-left:2px solid hsl(var(--mgmt))}
.byP{border-left:2px solid hsl(var(--prod))}
.tagM,.tagP{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  padding:.125rem .375rem;border-radius:3px}
.tagM{background:hsl(var(--recess));color:hsl(var(--ink-3))}
.tagP{background:hsl(var(--accent-soft));color:hsl(var(--accent))}

table.t{font-size:12.5px;min-width:38rem}
.t th{font-size:10px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;
  color:hsl(var(--ink-3));text-align:left;padding:.625rem .75rem;border-bottom:1px solid hsl(var(--line));white-space:nowrap}
.t td{padding:.5625rem .75rem;border-bottom:1px solid hsl(var(--line));vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tbody tr:hover td{background:hsl(var(--raised))}
.t [data-n]{text-align:right;white-space:nowrap}
.t .tot td{border-top:1.5px solid hsl(var(--ink));font-weight:600}

.inp{width:100%;height:32px;padding:0 .5rem;border:1px solid hsl(var(--line));border-radius:6px;
  background:hsl(var(--surface));font:inherit;font-size:12.5px;color:hsl(var(--ink))}
.inp:focus{border-color:hsl(var(--accent));outline:none}
.inp.blank{background:hsl(var(--accent-soft)/.5);border-style:dashed}
textarea.inp{height:auto;padding:.4375rem .5rem;line-height:1.3rem;resize:vertical}
.inp.n{text-align:right;font-family:'IBM Plex Mono',monospace}
.fld{display:flex;flex-direction:column;gap:.25rem}
.fld label{font-size:10px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;color:hsl(var(--ink-3))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4375rem;height:33px;
  padding:0 .8125rem;border-radius:7px;border:1px solid hsl(var(--line));background:hsl(var(--surface));
  font-size:12.5px;font-weight:500;transition:.12s;white-space:nowrap}
.btn:hover{background:hsl(var(--canvas));border-color:hsl(var(--line-2))}
.btn-primary{background:hsl(var(--ink));color:#fff;border-color:hsl(var(--ink))}
.btn-primary:hover{background:hsl(30 6% 24%)}
.btn-sm{height:27px;padding:0 .5625rem;font-size:11.5px}
.badge{display:inline-flex;align-items:center;gap:.25rem;padding:.125rem .4375rem;border-radius:999px;
  font-size:10px;font-weight:600;background:hsl(var(--recess));color:hsl(var(--ink-2));
  border:1px solid hsl(var(--line))}
.badge-a{background:hsl(var(--accent-soft));color:hsl(var(--accent));border-color:transparent}
.badge-p{background:hsl(var(--pos)/.1);color:hsl(var(--pos));border-color:transparent}
.badge-c{background:hsl(var(--cau)/.12);color:hsl(var(--cau));border-color:transparent}
.bar{height:5px;border-radius:999px;background:hsl(var(--recess));overflow:hidden}
.bar>i{display:block;height:100%;background:hsl(var(--accent));transition:width .5s}
.note{background:hsl(var(--accent-soft));border-left:2px solid hsl(var(--accent));
  padding:.75rem .9375rem;font-size:12.5px;line-height:1.3rem;color:hsl(var(--ink-2));border-radius:0 6px 6px 0}
.note.w{background:hsl(var(--cau)/.09);border-left-color:hsl(var(--cau))}
.note.d{background:hsl(var(--ink));color:hsl(38 8% 80%);border-left-color:hsl(var(--accent))}
.sample{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:hsl(var(--cau));background:hsl(var(--cau)/.1);padding:.1875rem .4375rem;border-radius:4px}

/* ── showcase ──────────────────────────────────────────────────────────*/
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:1rem}
.card{background:hsl(var(--surface));border:1px solid hsl(var(--line));border-radius:var(--r);
  overflow:hidden;transition:.16s;text-align:left;width:100%}
.card:hover{border-color:hsl(var(--line-2));box-shadow:0 4px 16px hsl(30 20% 20%/.07);transform:translateY(-2px)}
.card-img{aspect-ratio:3/4;background:hsl(var(--recess));position:relative;overflow:hidden;display:grid;place-items:center}
.card-img img{width:100%;height:100%;object-fit:cover}
.card-img .ph2{text-align:center;color:hsl(var(--ink-3))}
.card-img .ph2 b{display:block;font-size:1.125rem;opacity:.4}
.card-body{padding:.75rem .8125rem}
.card-code{font-family:'IBM Plex Mono',monospace;font-size:10px;color:hsl(var(--ink-3))}
.card-name{font-size:13px;font-weight:600;margin-top:.1875rem;letter-spacing:-.01em}
.card-meta{font-size:11px;color:hsl(var(--ink-3));margin-top:.25rem}
.card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:.5rem}

.sheet{position:fixed;inset:0;z-index:120;background:hsl(var(--canvas));display:none;overflow-y:auto}
.sheet.on{display:block}
.sheet-bar{position:sticky;top:0;z-index:5;height:54px;background:hsl(var(--canvas)/.94);
  backdrop-filter:blur(10px);border-bottom:1px solid hsl(var(--line));display:flex;align-items:center;
  gap:.75rem;padding:0 clamp(1rem,3vw,2rem)}
.sheet-in{max-width:74rem;margin:0 auto;padding:clamp(1.25rem,3vw,2rem)}
.shot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.625rem}
.shot{aspect-ratio:3/4;background:hsl(var(--recess));border:1px dashed hsl(var(--line-2));
  border-radius:8px;overflow:hidden;display:grid;place-items:center;cursor:pointer;position:relative}
.shot.filled{border-style:solid}
.shot img{width:100%;height:100%;object-fit:cover}
.shot span{font-size:10px;color:hsl(var(--ink-3));text-align:center;padding:.5rem}
.shot .x{position:absolute;top:5px;right:5px;width:20px;height:20px;border-radius:5px;
  background:hsl(var(--ink)/.72);color:#fff;font-size:11px;display:grid;place-items:center;opacity:0}
.shot:hover .x{opacity:1}

/* size matrix */
.sizemx{overflow-x:auto}
.sizemx table{min-width:30rem}
.sizemx th{text-align:center;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;
  padding:.4375rem .25rem;border-bottom:1px solid hsl(var(--line));color:hsl(var(--ink-3))}
.sizemx td{padding:.25rem;border-bottom:1px solid hsl(var(--line))}
.sizemx input{width:100%;min-width:48px;height:30px;text-align:center;border:1px solid hsl(var(--line));
  border-radius:5px;font-family:'IBM Plex Mono',monospace;font-size:12px;background:hsl(var(--surface))}
.sizemx input:focus{border-color:hsl(var(--accent));outline:none}
.sizemx .totcol{font-family:'IBM Plex Mono',monospace;font-weight:600;text-align:center}

.sb-toggle{display:none;position:fixed;top:12px;left:12px;z-index:60;width:34px;height:34px;
  background:hsl(var(--surface));border:1px solid hsl(var(--line));border-radius:7px;
  align-items:center;justify-content:center}
.sb-scrim{display:none;position:fixed;inset:0;background:hsl(30 20% 10%/.4);z-index:39}
@media(max-width:1023px){
  .sb{transform:translateX(-100%);transition:transform .26s}
  body.nav-on .sb{transform:none} body.nav-on .sb-scrim{display:block}
  .app{padding-left:0} .sb-toggle{display:flex} .topbar{padding-left:3.25rem}
  .shot-grid{grid-template-columns:repeat(2,1fr)}
}
@media print{.sb,.topbar,.sb-toggle{display:none!important}.app{padding-left:0}}

/* showcase card — quantity and size breakup */
.qtyline{display:flex;align-items:baseline;gap:.3125rem;margin-top:.5rem;
  padding-top:.5rem;border-top:1px solid hsl(var(--line))}
.qtybig{font-size:1.25rem;font-weight:600;letter-spacing:-.03em;line-height:1}
.sizestrip{display:flex;flex-wrap:wrap;gap:.25rem;margin-top:.4375rem}
.sizestrip span{display:inline-flex;align-items:baseline;gap:.1875rem;
  background:hsl(var(--recess));border-radius:4px;padding:.125rem .3125rem;line-height:1.1}
.sizestrip i{font-style:normal;font-size:9px;letter-spacing:.04em;color:hsl(var(--ink-3));font-weight:600}
.sizestrip b{font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600}

#toast{position:fixed;left:50%;bottom:1.5rem;transform:translate(-50%,1rem);z-index:200;
 background:hsl(var(--ink));color:#fff;padding:.625rem 1rem;border-radius:8px;font-size:12.5px;
 opacity:0;pointer-events:none;transition:.22s}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ── Summer Master additions ───────────────────────────────────────── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.625rem;margin:.25rem 0 1.25rem}
.kpi{background:#fff;border:1px solid hsl(var(--line));border-radius:10px;padding:.8rem .9rem}
.kv{font-size:1.35rem;font-weight:600;letter-spacing:-.02em;line-height:1.15;color:hsl(var(--ink))}
.kl{font-size:11px;color:hsl(var(--ink-3));margin-top:.2rem;letter-spacing:.04em}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
.panel{min-width:0}
main{overflow-x:hidden}
.t-lab{font-size:12.5px;color:hsl(var(--ink-2))}
.p-body.flush{padding:0}
.hero-dark h1,.hero-dark p{color:hsl(var(--surface))!important}
.chiprow{display:flex;gap:.4rem;overflow-x:auto;-webkit-overflow-scrolling:touch;
  padding:.25rem .1rem .55rem;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid hsl(var(--line));background:#fff;border-radius:999px;
  padding:.42rem .8rem;font-size:12px;color:hsl(var(--ink-2));cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:hsl(var(--ink));color:hsl(var(--surface));border-color:hsl(var(--ink))}
</style></head>
<body>
<button class="sb-toggle" id="navToggle" aria-label="Menu">☰</button>
<div class="sb-scrim" id="navScrim"></div>
<div id="root"></div>
<input type="file" id="importer" accept="application/json" hidden>
<script>
/* ═══ MENSCH PRODUCTION BLUEPRINT — data model & persistence ═════════════ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=p=>(p||'x')+Math.random().toString(36).slice(2,8);
const grp=n=>{n=String(Math.abs(Math.round(n||0)));if(n.length<=3)return n;
  const l=n.slice(-3);return n.slice(0,-3).replace(/\B(?=(\d{2})+(?!\d))/g,',')+','+l};
const inr=v=>'₹'+grp(v);
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};


/* ═══ THE MARK ═══════════════════════════════════════════════════════════ */
const BISON=`<path d="M16 42 C16 24 31 16 50 16 C69 16 84 24 84 42 C84 49 78 54 70 56 C69 63 67 70 64 74 C61 78 56 79 50 79 C44 79 39 78 36 74 C33 70 31 63 30 56 C22 54 16 49 16 42 Z" fill="none" stroke="CURRENT" stroke-width="3.8" stroke-linejoin="round"/> <g fill="CURRENT"> <path d="M30.68 19.58 C20 15 12 10 6 4 C10 13 14.5 19.5 21.90 25.70 C24.25 23.14 27.23 21.10 30.68 19.58 Z"/> <g transform="translate(100,0) scale(-1,1)"><path d="M30.68 19.58 C20 15 12 10 6 4 C10 13 14.5 19.5 21.90 25.70 C24.25 23.14 27.23 21.10 30.68 19.58 Z"/></g> <path d="M32 27 L44 27 L38 43 ZM43.5 26 L56.5 26 L50 48 ZM56 27 L68 27 L62 43 Z"/> </g>`;
const MARK=(size,colour)=>`<svg viewBox="0 0 100 100" class="bison" style="width:${size}px;height:${size}px">${BISON.replace(/CURRENT/g,colour||'currentColor')}</svg>`;
const LOCKUP=(h,colour)=>`<span class="lockup" style="font-size:${h}px">
 ${MARK(Math.round(h*1.9),colour)}<span class="lockword" style="color:${colour||'currentColor'}">MENSCH</span></span>`;

const KEY='mensch.summer.master.v1';
let DB=null;

/* ── size templates ───────────────────────────────────────────────────── */
const SIZE_SETS={
 top:['XS','S','M','L','XL','XXL','3XL'],
 bottom:['28','30','32','34','36','38','40'],
 alpha:['S','M','L','XL'],
 shoe:['UK6','UK7','UK8','UK9','UK10','UK11'],
 one:['One size'],
 free:['Free']
};
const SIZE_CURVE={                       // management's planned mix, editable
 top:{XS:5,S:15,M:26,L:30,XL:16,XXL:8,'3XL':0},
 bottom:{'28':6,'30':14,'32':26,'34':28,'36':18,'38':8,'40':0},
 alpha:{S:20,M:32,L:30,XL:18},
  shoe:{UK6:8,UK7:18,UK8:26,UK9:24,UK10:16,UK11:8},
  one:{'One size':100}, free:{Free:100}
};

/* ── material groups → categories (editable) ──────────────────────────── */
const MATERIAL_GROUPS=[
 {id:'woven',name:'Wovens',cats:['Shirts','Casual shirts','Formal shirts','Linen shirts','Overshirts'],sizes:'top'},
 {id:'knit',name:'Knits',cats:['T-Shirts','Polo shirts','Sweatshirts','Hoodies','Knit co-ords'],sizes:'top'},

 ];
 const designs=[];
 PLANNED.forEach(([cat,styles,units,ph])=>{
  const set=catSizes(cat), curve=SIZE_CURVE[set];
  const base=Math.floor(units/styles), extra=units-base*styles;
  for(let i=1;i<=styles;i++){
   const per=base+(i<=extra?1:0), qty={};
   const keys=SIZE_SETS[set];
   let run=0;
   keys.forEach(s=>{const v=Math.floor(per*(curve[s]||0)/100);qty[s]=v;run+=v});
   // remainder goes to the deepest sizes first, so the curve stays true
   const order=[...keys].sort((a,b)=>(curve[b]||0)-(curve[a]||0));
   let k=0; while(run<per){qty[order[k%order.length]]++;run++;k++}
   designs.push({
    id:uid('d'), code:codeFor(cat,i), name:'', cat,

   });

 });

const dTotal=d=>Object.values(d.qty||{}).reduce((a,b)=>a+num(b),0);
const dSkus=d=>Object.values(d.qty||{}).filter(v=>num(v)>0).length*(num(d.colours)||1);
function rollup(list){
 list=list||DB.designs;
 return {designs:list.length,
  pieces:list.reduce((a,d)=>a+dTotal(d),0),
  skus:list.reduce((a,d)=>a+dSkus(d),0),
  colourways:list.reduce((a,d)=>a+(num(d.colours)||1),0)};
}

const PROD_FIELDS=['quotedCost','moq','vendor','leadTime'];

function completion(){
 const total=DB.designs.length*PROD_FIELDS.length;

}

/* ═══ FACTORY LANDING COST ENGINE ════════════════════════════════════════
   Every input is entered by the production team. Nothing is pre-filled.
   Landing cost stops at the packed, QC-passed garment inside the factory.  */
const TRIM_ROWS=['Buttons','Zipper','Thread','Elastic','Interlining','Main label',
 'Size label','Wash-care label','Hang tag','Drawcord','Eyelets','Other trims'];
const PROC_ROWS=['Dyeing','Washing','Printing','Embroidery','Enzyme wash','Silicon wash',
 'Garment dye','Distressing','Special finish'];

function C(d){ d.cost=d.cost||{}; const c=d.cost;
 c.fab=c.fab||{cons:'',unit:'m',rate:'',waste:'',shrink:''};
 c.trims=c.trims||{}; c.proc=c.proc||{};
 c.cut=c.cut||{marker:'',labour:'',bundle:''};
 c.stitch=c.stitch||{mode:'sam',sam:'',rate:'',eff:'',flat:''};
 c.fin=c.fin||{trim:'',iron:'',button:'',insp:'',fold:''};
 c.qc=c.qc||{inline:'',endline:'',final:'',reject:'',rework:''};
 c.pack=c.pack||{poly:'',sticker:'',tissue:'',carton:''};
 c.oh=c.oh||{mode:'perpiece',perpiece:'',monthly:'',output:''};
 return c;
}
const sum=o=>Object.values(o||{}).reduce((a,b)=>a+num(b),0);

function costOf(d){
 const c=C(d);
 const cons=num(c.fab.cons), rate=num(c.fab.rate);
 const fabric=cons*(1+num(c.fab.waste)/100)*(1+num(c.fab.shrink)/100)*rate;
 const trims=Object.values(c.trims).reduce((a,t)=>a+num(t.qty)*num(t.rate),0);
 const proc=Object.values(c.proc).reduce((a,p)=>a+num(p),0);
 const cut=sum(c.cut);
 const st=c.stitch;
 const stitch=st.mode==='flat'?num(st.flat)
  :(num(st.eff)>0?num(st.sam)/(num(st.eff)/100)*num(st.rate):0);
 const fin=sum(c.fin);
 const qcCost=num(c.qc.inline)+num(c.qc.endline)+num(c.qc.final);
 const pack=sum(c.pack);
 const oh=c.oh.mode==='perpiece'?num(c.oh.perpiece)
  :(num(c.oh.output)>0?num(c.oh.monthly)/num(c.oh.output):0);
 const sub=fabric+trims+proc+cut+stitch+fin+qcCost+pack+oh;
 const rej=Math.min(40,num(c.qc.reject))/100;
 const landing=rej<1?sub/(1-rej):sub;
 return {fabric,trims,proc,cut,stitch,fin,qc:qcCost,pack,oh,sub,
  rejAdd:landing-sub,landing,
  filled:[fabric,trims,proc,cut,stitch,fin,qcCost,pack,oh].some(v=>v>0)};
}
function fabricNeed(d){
 const c=C(d), cons=num(c.fab.cons);
 if(!cons)return 0;
 return cons*(1+num(c.fab.waste)/100)*dTotal(d);
}
function projectCost(list){
 list=list||DB.designs;
 let total=0,costed=0,pieces=0,fabMetres=0,lo=null,hi=null;
 list.forEach(d=>{
  const r=costOf(d), q=dTotal(d);
  pieces+=q; fabMetres+=fabricNeed(d);
  if(r.filled){costed++; total+=r.landing*q;
   if(lo===null||r.landing<lo.v)lo={v:r.landing,d};
   if(hi===null||r.landing>hi.v)hi={v:r.landing,d}}
 });
 return {total,costed,designs:list.length,pieces,fabMetres,lo,hi,
  avg:pieces&&costed?total/list.filter(d=>costOf(d).filled)
    .reduce((a,d)=>a+dTotal(d),0):0};
}

 ['admin','Admin / accounts','Payroll, compliance, records']
];
const nz=v=>num(v)||0;
function factoryTotals(){
 const f=F();
 const sqft=SPACES.reduce((a,[k])=>a+nz((f.spaces[k]||{}).sqft),0);
 const rent=sqft*nz(f.rate);
 return {sqft,rent,deposit:nz(f.deposit),fitout:nz(f.fitout)};
}
function machineTotals(){
 const m=DB.machines=DB.machines||{};
 let qty=0,capex=0,kw=0,ops=0;
 MACHINES.forEach(([k])=>{const x=m[k]||{};
  const q=nz(x.qty); qty+=q; capex+=q*nz(x.price); kw+=q*nz(x.kw); ops+=q*nz(x.ops)});
 return {qty,capex,kw,ops};
}
function manpowerTotals(){
 const r=DB.roles=DB.roles||{};
 let head=0,monthly=0;
 ROLES.forEach(([k])=>{const x=r[k]||{};
  const h=nz(x.head); head+=h; monthly+=h*nz(x.salary)});
 return {head,monthly};
}
function capacityModel(){
 const f=F(), m=DB.capacity=DB.capacity||{};
 const mt=machineTotals();
 const machines=nz(m.machines)||mt.qty;
 const hours=nz(f.hours)||8, days=nz(f.days)||26, shifts=nz(f.shifts)||1;
 const sam=nz(m.sam), eff=nz(m.eff);
 const minutes=machines*hours*60*days*shifts;
 const out=(sam>0&&eff>0)?Math.floor(minutes*(eff/100)/sam):0;
 const levels=[25,50,75,90].map(p=>({p,pieces:Math.floor(out*p/100)}));
 return {machines,hours,days,shifts,sam,eff,minutes,out,levels};
}

/* ── 11 · PRODUCTION CAPACITY ─────────────────────────────────────────── */
P.capacity=()=>{
 const c=capacityModel(), f=F(), m=DB.capacity=DB.capacity||{};
 const mp=manpowerTotals(), ft=factoryTotals(), mt=machineTotals();
 const monthlyFixed=ft.rent+mp.monthly+nz(m.otherFixed);
 const r=rollup();
 const months=c.out?(r.pieces/c.out):0;
 const outRate=nz(m.outRate), inCost=c.out?monthlyFixed/c.out+nz(m.inVar):0;
 const saving=outRate&&inCost?outRate-inCost:0;
 const be=saving>0?Math.ceil(monthlyFixed/(outRate-nz(m.inVar))):0;
 return `
 <div class="ph"><h1>Production Capacity</h1>
  <p class="sub">What the floor can actually produce, and whether making it beats buying it.</p></div>
 ${brief('The output model and the make-versus-outsource decision.',
  'The order quantity — '+grp(r.pieces)+' pieces across '+r.designs+' designs.',
  'Machine count, average SAM, line efficiency and the outsourced rate to compare against.',
  'Capacity decides whether the order is deliverable. Break-even decides whether it should be made in-house at all.')}

 <div class="panel"><div class="p-body">
  <div class="g4" style="gap:.75rem">
   ${fld('Stitching machines',m.machines||mt.qty||'','data-cap="machines" inputmode="numeric"','From machinery list',1)}
   ${fld('Average SAM (minutes)',m.sam,'data-cap="sam" inputmode="decimal"','Across the range',1)}
   ${fld('Line efficiency %',m.eff,'data-cap="eff" inputmode="decimal"','e.g. 55',1)}
   ${fld('Other monthly fixed ₹',m.otherFixed,'data-cap="otherFixed" inputmode="numeric"','Power, admin, misc',1)}
  </div>
  <div class="t-micro faint" style="margin-top:.625rem">
   Machines × ${c.hours} hours × 60 × ${c.days} days × ${c.shifts} shift${c.shifts>1?'s':''} × efficiency ÷ SAM.
   Shift pattern is set on the Factory Plan.</div>
 </div></div>

 ${blk('Monthly output')}
 <div class="g4">
  ${c.levels.map(l=>`<div class="panel"><div class="p-body">
   <div class="caps">At ${l.p}% utilisation</div>
   <div class="fig" style="font-size:1.5rem;margin-top:.25rem">${l.pieces?grp(l.pieces):'—'}</div>
   <div class="t-micro faint" style="margin-top:.25rem">pieces per month</div>
   <div class="bar" style="margin-top:.5rem"><i style="width:${l.p}%"></i></div>
  </div></div>`).join('')}
 </div>
 ${c.out?`<div class="note" style="margin-top:.875rem">
   At 100% theoretical utilisation the floor produces <b>${grp(c.out)} pieces a month</b>.
   The full order of ${grp(r.pieces)} pieces would take <b>${months.toFixed(1)} months</b> at full load,
   or <b>${(months/0.75).toFixed(1)} months</b> at a realistic 75%.</div>`
  :'<div class="note w" style="margin-top:.875rem">Enter machines, SAM and efficiency to model output.</div>'}

 ${blk('Make or outsource','The number that decides it')}
 <div class="g2" style="align-items:start">
  <div class="panel"><div class="p-body">
   <div class="g2" style="gap:.75rem">
    ${fld('Outsourced rate ₹ / piece',m.outRate,'data-cap="outRate" inputmode="decimal"','What a CMT unit quotes',1)}
    ${fld('In-house variable ₹ / piece',m.inVar,'data-cap="inVar" inputmode="decimal"','Excluding fixed cost',1)}
   </div>
   <div class="stack-s" style="margin-top:.875rem">
    ${[['Monthly fixed cost',monthlyFixed?inr(Math.round(monthlyFixed)):'—','Rent + payroll + other'],
       ['In-house cost / piece',inCost?inr(Math.round(inCost)):'—','Fixed ÷ output + variable'],
       ['Saving vs outsourcing',saving?inr(Math.round(saving)):'—','Per piece, at full output']].map(([k,v,s])=>
     `<div class="row-between"><div><div class="t-label semi">${k}</div>
       <div class="t-micro faint">${s}</div></div><span class="fig semi">${v}</span></div>`).join('')}
   </div>
  </div></div>
  <div class="panel ${be?'ink':''}"><div class="p-body">
   <div class="caps" style="${be?'color:hsl(34 22% 66%)':''}">Break-even volume</div>
   <div class="fig" style="font-size:2rem;margin-top:.25rem;letter-spacing:-.035em">
    ${be?grp(be):'—'}</div>
   <div class="t-micro ${be?'':'faint'}" style="margin-top:.375rem;${be?'color:hsl(34 22% 66%)':''}">
    pieces per month</div>
   ${be?`<p style="margin-top:.875rem;font-size:12.5px;line-height:1.3rem;color:hsl(38 10% 82%)">
     Below ${grp(be)} pieces a month, outsourcing is cheaper. Above it, the factory pays for itself.
     ${c.out?`At your modelled output of ${grp(c.out)} that is
      <b style="color:#fff">${c.out>=be?'above':'below'} break-even</b>.`:''}</p>`
    :'<p class="t-micro faint" style="margin-top:.75rem">Enter an outsourced rate and in-house variable cost to see the crossover.</p>'}
  </div></div>
 </div>

 ${blk('Output by garment type','One factory floor, running each garment type on its own')}
 <div class="panel"><div class="p-body flush"><table class="t">
  <thead><tr><th>Garment</th><th>Group</th><th data-n style="width:5.5rem">SAM</th>
   <th data-n>Landing cost</th><th data-n>Pieces / day</th><th data-n>Pieces / month</th>
   <th data-n>Order qty</th><th data-n>Days needed</th></tr></thead>
  <tbody>${CATS().map(cat=>{
   const l=byCat(cat), pcx=projectCost(l), g=MATERIAL_GROUPS.find(m=>m.id===catGroup(cat));
   DB.catSam=DB.catSam||{};
   const sam=nz(DB.catSam[cat]);
   const perDay=(sam&&c.eff&&c.machines)
     ? Math.floor(c.machines*nz(c.hours)*60*nz(c.shifts)*(nz(c.eff)/100)/sam) : 0;
   const perMonth=perDay*nz(c.days);
   const qty=rollup(l).pieces;
   const days=perDay?Math.ceil(qty/perDay):0;
   return `<tr><td class="semi">${esc(cat)}</td>
    <td class="t-label muted">${g?esc(g.name):'—'}</td>
    <td><input class="inp n blank" value="${esc(DB.catSam[cat]||'')}" data-csam="${esc(cat)}" inputmode="decimal"></td>
    <td data-n class="fig ${pcx.avg?'':'faint'}">${pcx.avg?inr(Math.round(pcx.avg)):'—'}</td>
    <td data-n class="fig ${perDay?'':'faint'}">${perDay?grp(perDay):'—'}</td>
    <td data-n class="fig semi ${perMonth?'':'faint'}">${perMonth?grp(perMonth):'—'}</td>
    <td data-n class="fig">${grp(qty)}</td>
    <td data-n class="fig ${days?'':'faint'}">${days?grp(days):'—'}</td></tr>`}).join('')}
  </tbody></table></div></div>
 <div class="note" style="margin-top:.875rem">
  Each row assumes the <b>whole floor</b> runs that garment alone — that is the honest way to compare a shirt against a jean, because they do not share a line efficiently.
  Enter the SAM for each garment type and the daily and monthly output follows from the same machine count, hours and efficiency set above.
  ${c.machines?`Currently modelled on <b>${grp(c.machines)} machines × ${nz(c.hours)} hours × ${nz(c.shifts)} shift${nz(c.shifts)>1?'s':''} × ${nz(c.eff)||'—'}% efficiency</b>, ${nz(c.days)} days a month.`:''}</div>

 ${blk('Consistency checks','Every number that must agree with another')}
<div class="panel"><div class="p-body flush"><table class="t">
 <thead><tr><th style="width:2.5rem"></th><th>Check</th><th>Detail</th></tr></thead>
 <tbody>${consistency().map(x=>`<tr>
  <td style="text-align:center;font-size:14px">${x.ok?'<span class="pos">✓</span>':'<span class="neg">✗</span>'}</td>
  <td class="${x.ok?'':'semi'}">${esc(x.label)}</td>
  <td class="t-label muted">${esc(x.detail)}</td></tr>`).join('')}
 </tbody></table></div></div>
${(()=>{const bad=consistency().filter(x=>!x.ok).length;
 return bad?`<div class="note w" style="margin-top:.875rem"><b>${bad} check${bad>1?'s':''} failing.</b> Fix these before the numbers are used for a decision — a figure that disagrees with another is worse than a blank.</div>`
 :'<div class="note" style="margin-top:.875rem">Every cross-tab figure agrees. Change any input and these checks re-run.</div>'})()}

${blk('Capacity against the order')}
 <div class="panel"><div class="p-body flush"><table class="t">
  <thead><tr><th>Phase</th><th data-n>Pieces</th><th data-n>Months at 75%</th>
   <th data-n>Machines needed</th><th>Feasibility</th></tr></thead>
  <tbody>${DB.phases.map(p=>{const x=rollup(byPhase(p.id));
   const at75=c.out*0.75, mo=at75?x.pieces/at75:0;
   const need=(c.sam&&c.eff&&c.hours&&c.days)
    ? Math.ceil(x.pieces*c.sam/((c.eff/100)*c.hours*60*c.days*c.shifts)) : 0;
   return `<tr><td class="semi">${esc(p.no)} · ${esc(p.name)}</td>
    <td data-n class="fig">${grp(x.pieces)}</td>
    <td data-n class="fig ${mo?'':'faint'}">${mo?mo.toFixed(1):'—'}</td>
    <td data-n class="fig ${need?'':'faint'}">${need?grp(need):'—'}</td>
    <td class="t-label muted">${need?(need<=c.machines?'<span class="badge badge-p">Within capacity</span>'
      :'<span class="badge badge-c">Needs '+(need-c.machines)+' more machines</span>'):'—'}</td></tr>`}).join('')}
  </tbody></table></div></div>
 <div class="note" style="margin-top:.875rem">Machines needed assumes each phase is produced in one month. If a phase runs longer, the machine requirement falls proportionally — the timeline page in Phase 4 will let you spread it.</div>`;
};

/* ── validation ───────────────────────────────────────────────────────── */
function validate(){
 const g=[], f=F(), mt=machineTotals(), mp=manpowerTotals(), ft=factoryTotals(),
  cap=capacityModel(), pc=projectCost(), T=DB.timeline||{}, V=DB.vendors||[];
 const add=(sec,page,what,critical)=>g.push({sec,page,what,critical});
 // costing
 const unCosted=DB.designs.filter(d=>!costOf(d).filled);
 if(unCosted.length)add('Costing','costing',
  unCosted.length+' of '+DB.designs.length+' designs have no cost sheet',true);
 const noCons=DB.designs.filter(d=>!num(C(d).fab.cons));
 if(noCons.length)add('Costing','costing',
  noCons.length+' designs have no fabric consumption — fabric requirement cannot be calculated',true);
 // commercial
 const noQuote=DB.designs.filter(d=>!String(d.quotedCost||'').trim());
 if(noQuote.length)add('Showcase','showcase',noQuote.length+' designs have no quoted factory cost',true);
 const noMoq=DB.designs.filter(d=>!String(d.moq||'').trim());
 if(noMoq.length)add('Showcase','showcase',noMoq.length+' designs have no MOQ stated',false);
 const noLead=DB.designs.filter(d=>!String(d.leadTime||'').trim());
 if(noLead.length)add('Showcase','showcase',noLead.length+' designs have no lead time',false);
 // factory
 if(!ft.sqft)add('Factory','factory','No space requirement entered',true);
 if(!num(f.rate))add('Factory','factory','No rent per square foot',false);
 if(!mt.qty)add('Machinery','machinery','No machines listed',true);
 if(!mt.capex)add('Machinery','machinery','No machine prices — capital cost cannot be calculated',true);
 if(!mp.head)add('Manpower','manpower','No headcount entered',true);
 if(!mp.monthly)add('Manpower','manpower','No salaries entered — payroll cannot be calculated',true);
 // capacity
 if(!num((DB.capacity||{}).sam))add('Capacity','capacity','No average SAM — output cannot be modelled',true);
 if(!num((DB.capacity||{}).eff))add('Capacity','capacity','No line efficiency',true);
 if(!cap.out)add('Capacity','capacity','Monthly output not modelled',true);
 const noSam=CATS().filter(c=>!num((DB.catSam||{})[c]));
 if(noSam.length)add('Capacity','capacity',
  noSam.length+' garment types have no SAM — per-garment output is blank',false);
 if(!num((DB.capacity||{}).outRate))add('Capacity','capacity',
  'No outsourced rate — make-versus-buy cannot be assessed',false);
 // sourcing
 if(!V.length)add('Vendors','vendors','No vendors listed',true);
 const noBackup=V.filter(v=>!String(v.backup||'').trim());
 if(V.length&&noBackup.length)add('Vendors','vendors',
  noBackup.length+' vendors have no backup identified',false);
 // quality
 const q=DB.qcStd||{};
 const qcSet=QC_ROWS.filter(([k])=>String((q[k]||{}).std||'').trim()).length;
 if(qcSet<QC_ROWS.length)add('Quality','qc',
  (QC_ROWS.length-qcSet)+' quality checkpoints have no standard set',qcSet===0);
 if(!num(q.rejPct))add('Quality','qc','No expected rejection percentage',false);
 // timeline
 const tSet=STAGES.filter(([k])=>num((T[k]||{}).days)).length;
 if(tSet<STAGES.length)add('Timeline','timeline',
  (STAGES.length-tSet)+' stages have no duration',tSet===0);
 if(!(DB.risks||[]).length)add('Timeline','timeline','No risks logged',false);
 return g;
}
function readiness(){
 const g=validate();
 const crit=g.filter(x=>x.critical).length;
 const CHECKS=22;
 const pct=Math.max(0,Math.round((CHECKS-g.length)/CHECKS*100));
 return {gaps:g,crit,pct:Math.min(100,pct)};
}

function csv(rows){return '\ufeff'+rows.map(r=>r.map(x=>{
 const v=String(x==null?'':x);
 return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\r\n')}
function exportCSV(kind){
 const stamp=new Date().toISOString().slice(0,10);
 if(kind==='costcsv'){
  const rows=[['Code','Name','Category','Group','Phase','Pieces','Colours','Fabric','Trims',
   'Processing','Cutting','Stitching','Finishing','QC','Packing','Overhead','Subtotal',
   'Rejection %','Landing cost','Total cost','MRP','Margin %']];
  DB.designs.forEach(d=>{const c=costOf(d),q=dTotal(d),
   ph=DB.phases.find(p=>p.id===d.phase), m=num(d.mrp);
   rows.push([d.code,d.name,d.cat,d.group,ph?ph.name:'',dTotal(d),num(d.colours)||1,
    c.fabric.toFixed(2),c.trims.toFixed(2),c.proc.toFixed(2),c.cut.toFixed(2),c.stitch.toFixed(2),
    c.fin.toFixed(2),c.qc.toFixed(2),c.pack.toFixed(2),c.oh.toFixed(2),c.sub.toFixed(2),
    num(C(d).qc.reject),c.landing.toFixed(2),(c.landing*q).toFixed(2),m||'',
    m&&c.landing?((m-c.landing)/m*100).toFixed(1):''])});
  return download(csv(rows),'MENSCH_CostSheet_'+stamp+'.csv','text/csv;charset=utf-8');
 }
 if(kind==='descsv'){
  const sizes=[...new Set(DB.designs.flatMap(d=>SIZE_SETS[d.sizeSet]))];
  const rows=[['Code','Name','Category','Group','Phase','Fabric','GSM','Fit','Colour','Colours',
   ...sizes,'Total','Quoted cost','MOQ','Vendor','Lead time']];
  DB.designs.forEach(d=>{const ph=DB.phases.find(p=>p.id===d.phase);
   rows.push([d.code,d.name,d.cat,d.group,ph?ph.name:'',d.fabric,d.gsm,d.fit,d.colour,
    num(d.colours)||1,...sizes.map(s=>d.qty[s]??''),dTotal(d),d.quotedCost,d.moq,d.vendor,d.leadTime])});
  return download(csv(rows),'MENSCH_Assortment_'+stamp+'.csv','text/csv;charset=utf-8');
 }
 if(kind==='setupcsv'){
  const f=F(),ft=factoryTotals(),mt=machineTotals(),mp=manpowerTotals(),cap=capacityModel();
  const rows=[['Section','Item','Detail','Value']];
  rows.push(['Factory','Operating model','',f.model||'']);
  SPACES.forEach(([k,n])=>rows.push(['Factory',n,'sq ft',(f.spaces[k]||{}).sqft||'']));
  rows.push(['Factory','Total area','sq ft',ft.sqft],['Factory','Rent per sq ft','₹',f.rate||''],
   ['Factory','Monthly rent','₹',Math.round(ft.rent)],['Factory','Deposit','₹',ft.deposit],
   ['Factory','Fit-out','₹',ft.fitout],['','','','']);
  MACHINES.forEach(([k,n])=>{const x=(DB.machines||{})[k]||{};
   if(num(x.qty))rows.push(['Machinery',n,'qty × ₹'+(x.price||0),num(x.qty)*num(x.price)])});
  rows.push(['Machinery','Total machines','',mt.qty],['Machinery','Capital cost','₹',mt.capex],
   ['Machinery','Connected load','kW',mt.kw.toFixed(1)],['','','','']);
  ROLES.forEach(([k,n])=>{const x=(DB.roles||{})[k]||{};
   if(num(x.head))rows.push(['Manpower',n,num(x.head)+' × ₹'+(x.salary||0),num(x.head)*num(x.salary)])});
  rows.push(['Manpower','Headcount','',mp.head],['Manpower','Monthly payroll','₹',mp.monthly],['','','','']);
  rows.push(['Capacity','Machines','',cap.machines],['Capacity','Average SAM','min',cap.sam],
   ['Capacity','Efficiency','%',cap.eff],['Capacity','Monthly output','pieces',cap.out]);
  cap.levels.forEach(l=>rows.push(['Capacity','Output at '+l.p+'%','pieces',l.pieces]));
  CATS().forEach(c=>{const sam=num((DB.catSam||{})[c]);
   if(sam){const pd=Math.floor(cap.machines*cap.hours*60*cap.shifts*(cap.eff/100)/sam);
    rows.push(['Capacity',c+' — per day','SAM '+sam,pd],['Capacity',c+' — per month','',pd*cap.days])}});
  return download(csv(rows),'MENSCH_Setup_'+stamp+'.csv','text/csv;charset=utf-8');
 }
 if(kind==='needs'){
  const rows=[['#','Request','Why it matters','Priority']];
  NEEDS.forEach((n,i)=>rows.push([i+1,n[0],n[1],n[2]]));
  return download(csv(rows),'MENSCH_Vendor_Requests_'+stamp+'.csv','text/csv;charset=utf-8');
 }
 if(kind==='tlcsv'){
  const T=DB.timeline||{};let cum=0;
  const rows=[['#','Stage','Owner','Days','Cumulative']];
  STAGES.forEach(([k,n,o],i)=>{const x=T[k]||{},dd=num(x.days);cum+=dd;
   rows.push([i+1,n,x.owner||o,dd||'',dd?cum:''])});
  rows.push(['','Total lead time','',cum,''],['','','','','']);
  rows.push(['Risk','Area','Likelihood','Impact','Mitigation']);
  (DB.risks||[]).forEach(r=>rows.push([r.name,r.area,r.p,r.i,r.mit]));
  return download(csv(rows),'MENSCH_Timeline_'+stamp+'.csv','text/csv;charset=utf-8');
 }
}

/* ── R2 image storage (Cloudflare Worker) ── */
const API_BASE='https://my-gallery.menschapparels.workers.dev';
function r2Pw(){
 let p=sessionStorage.getItem('r2pw');
 if(!p){p=prompt('Enter upload password:');if(p)sessionStorage.setItem('r2pw',p)}
 return p;
}
const r2Url=k=>API_BASE+'/img/'+encodeURIComponent(k);
const isR2=u=>typeof u==='string'&&u.indexOf(API_BASE+'/img/')===0;
async function readImg(file,key,cb){
 const pw=r2Pw(); if(!pw)return;
 toast('Uploading…');
 try{
  const k=key+'-'+Date.now();
  const res=await fetch(API_BASE+'/api/upload/'+encodeURIComponent(k),{
   method:'PUT',
   headers:{'Content-Type':file.type||'image/jpeg','X-Auth':pw},
   body:file
  });
  if(res.status===401){sessionStorage.removeItem('r2pw');toast('Wrong password');return}
  if(!res.ok){toast('Upload failed');return}
  cb(r2Url(k));
  toast('Image uploaded');
 }catch(e){toast('Upload failed — check connection')}
}
function r2Delete(url){
 if(!isR2(url))return;
 const pw=r2Pw(); if(!pw)return;
 const key=decodeURIComponent(url.slice((API_BASE+'/img/').length));
 fetch(API_BASE+'/api/delete/'+encodeURIComponent(key),{method:'DELETE',headers:{'X-Auth':pw}}).catch(()=>{});
}
function download(text,name,mime){
 const b=new Blob([text],{type:mime});const a=document.createElement('a');
 a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();
 setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},400)}

/* ── Cloud sync: the whole workbook lives in R2, so every browser sees the same data ── */
let cloudReady=false, cloudT=null, cloudBusy=false, cloudSkip=false;
function cloudSchedule(){
 if(!cloudReady||cloudSkip)return;
 clearTimeout(cloudT);
 cloudT=setTimeout(cloudPush,1500);
}
async function cloudPush(){
 cloudT=null;
 if(cloudBusy){cloudSchedule();return}
 const pw=r2Pw();
 if(!pw){cloudSkip=true;toast('Not synced — saved on this device only');return}
 cloudBusy=true;
 try{
  const res=await fetch(API_BASE+'/api/data',{
   method:'PUT',
   headers:{'Content-Type':'application/json','X-Auth':pw},
   body:JSON.stringify(DB)
  });
  if(res.status===401){sessionStorage.removeItem('r2pw');toast('Wrong password — not synced')}
  else if(!res.ok){toast('Cloud save failed')}
  else{toast('Saved to cloud')}
 }catch(e){toast('Cloud save failed — check connection')}
 cloudBusy=false;
}
async function cloudPull(){
 try{
  const res=await fetch(API_BASE+'/api/data?t='+Date.now(),{cache:'no-store'});
  if(res.ok){
   const j=await res.json();
   if(j&&j.designs){
    DB=j;
    try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}
    cloudReady=true;render();return;
   }
  }
  if(res.status===404){
   cloudReady=true;      // cloud is empty: push this browser's workbook up
   cloudSchedule();
   return;
  }
  toast('Could not load cloud data');
 }catch(e){toast('Offline — showing this device\u2019s copy')}
}

/* every cross-tab number that must agree with another */
function consistency(){
 const out=[];
 const m=DB.machines||{}, r=DB.roles||{}, c=capacityModel(),
       mt=machineTotals(), mp=manpowerTotals(), ft=factoryTotals(), pc=projectCost();
 const sew=sewingMachines();
 const ops=+((r.op||{}).head)||0;
 const chk=(ok,label,detail)=>out.push({ok,label,detail});
 chk(sew===c.machines,'Capacity uses the sewing machines on the list',
   sew+' sewing machines · capacity model uses '+c.machines);
 chk(ops>=sew*0.9&&ops<=sew*1.15,'Operators staff the line',
   ops+' operators for '+sew+' line machines');
 const need=c.sam&&c.eff?Math.ceil(c.out*c.sam/((c.eff/100)*c.hours*60*c.days*c.shifts)):0;
 chk(!need||Math.abs(need-c.machines)<=1,'Output is achievable on the machines listed',
   c.out.toLocaleString('en-IN')+' pcs/month needs '+need+' machines');
 const r2=rollup();
 chk(pc.pieces===r2.pieces,'Costed quantity equals the assortment',
   grp(pc.pieces)+' costed · '+grp(r2.pieces)+' in the plan');
 chk(pc.costed===pc.designs,'Every design carries a cost sheet',
   pc.costed+' of '+pc.designs);
 const shirt=DB.designs.find(d=>d.cat==='Shirts');
 const sd=shirt?Math.abs(costOf(shirt).landing-QUOTE.fob):0;
 chk(sd<1,'Shirt cost matches the vendor quote',
   shirt?'₹'+costOf(shirt).landing.toFixed(2)+' vs vendor ₹'+QUOTE.fob.toFixed(2):'—');
 chk(ft.sqft>0&&ft.rent===ft.sqft*num(F().rate),'Rent equals area × rate',
   grp(ft.sqft)+' sq ft × ₹'+F().rate+' = ₹'+grp(Math.round(ft.rent)));
 const fixed=ft.rent+mp.monthly+num((DB.capacity||{}).otherFixed);
 const be=num((DB.capacity||{}).outRate)>num((DB.capacity||{}).inVar)
   ?Math.ceil(fixed/(num((DB.capacity||{}).outRate)-num((DB.capacity||{}).inVar))):0;
 chk(be>0,'Break-even is computable',
   be?grp(be)+' pcs/month against outsourcing at ₹'+num((DB.capacity||{}).outRate):'set the outsourced rate');
 chk(c.out<be,'Make-or-buy verdict is consistent with volume',
   c.out<be?'Output '+grp(c.out)+' is below break-even '+grp(be)+' — outsource'
           :'Output exceeds break-even — in-house justified');
 const mtOps=mt.ops;
 chk(mtOps<=mp.head,'Machine operator requirement fits headcount',
   mtOps+' operators required by the machine list · '+mp.head+' people budgeted');
 return out;
}

 const U=QUOTE.uplift;

 // ── cost sheets ────────────────────────────────────────────────────────
 DB.designs.forEach(d=>{
  const fr=FABRATE[d.cat]||[1.2,200,'ours'];
  const cr=CMRATE[d.cat]||[8,70,20,'ours'];
  const c=C(d);
  c.fab={cons:fr[0],unit:'m',rate:fr[1],waste:0,shrink:0};
  c.trims={'Buttons':{qty:1,rate:0},'Thread':{qty:1,rate:6.60},
   'Interlining':{qty:1,rate:2.20},'Main label':{qty:1,rate:0.88},
   'Size label':{qty:1,rate:0.275},'Wash-care label':{qty:1,rate:1.10},
   'Hang tag':{qty:1,rate:1.98},'Other trims':{qty:1,
     rate:Math.max(0,(TRIMBY[d.cat]||18)-(6.60+2.20+0.88+0.275+1.10+1.98))}};
  c.proc={'Washing':WASHBY[d.cat]||6};
  c.cut={marker:0,labour:cr[0],bundle:0};
  c.stitch={mode:'flat',sam:'',rate:'',eff:'',flat:cr[1]};
  c.fin={trim:0,iron:0,button:cr[2],insp:0,fold:0};
  c.qc={inline:0,endline:0,final:2,reject:U.rejectPct,rework:0};
  // factory packing already sits inside the vendor's trim total
  c.pack={poly:0,sticker:0,tissue:0,carton:0};
  // reproduce the vendor's own formula, then express the difference as overhead
  // so our engine lands on exactly the number they quoted
  const fab=fr[0]*fr[1], trims=TRIMBY[d.cat]||18, wash=WASHBY[d.cat]||6;
  const vendorOH=5, testing=2;
  const base=fab+trims+wash+testing+vendorOH+cr[0]+cr[1]+cr[2];
  const markup=base*MARKUP_EFF/100;
  const fob=(base+markup)*(1+U.rejectPct/100)+U.logistics;
  const rest=fab+trims+wash+cr[0]+cr[1]+cr[2]+testing;
  const oh=fob*(1-U.rejectPct/100)-rest;
  c.oh={mode:'perpiece',perpiece:Math.round(oh*100)/100,monthly:'',output:''};
  d.quotedCost=Math.round(costOf(d).landing);
  d.moq=500;
  d.vendor='Sanjay & team';
  d.leadTime=45;
  if(!d.fabric)d.fabric=fr===FABRATE['Shirts']?'100% cotton poplin':'';
 });

 DB.vendors=[

 // ── quality ────────────────────────────────────────────────────────────
 DB.qcStd={rejPct:QUOTE.uplift.rejectPct, reworkPct:60,
  aqlLevel:'2.5 Level II', freq:'100% pre-shipment, AQL audit on receipt',
  notes:'Vendor quote carries garment testing at ₹2 and a 3% rejection allowance. Standards below are ours to agree with them.'};
 [['fabinsp','20 points per 100 sq yd','Inward','Reject the roll'],
  ['shade','No visible variation under D65','Inward','Reject the lot'],
